<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9fafb"><meta name="description" content="选择看过的动画，生成观看清单图片。">
  <title>番迹 · 动画观看清单</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="workspace">
      <section class="catalog" aria-label="动画目录">
        <div class="catalog-heading"><div><h2 id="catalog-title">动画目录</h2><span id="result-count">正在加载动画目录…</span></div></div>
        <div id="catalog-status" role="status" class="empty">正在加载动画目录…</div><div id="grid" class="grid"></div><button id="load-more" class="load-more" hidden>加载更多 ↓</button>
        <footer class="catalog-footer"><span>资料来源 <a href="https://bgm.tv" target="_blank" rel="noreferrer">Bangumi 番组计划 ↗</a></span><span id="updated"></span><p>按作品首播时间收录；封面版权归原权利人所有。</p></footer>
      </section>
      <div class="sidebar">
        <div class="filters"><header class="fixed-heading"><a class="brand" href="./" aria-label="番迹首页"><span class="brand-icon">番</span><strong>番迹</strong></a><nav class="mode-switch" aria-label="清单模式"><a href="?mode=anime" data-mode="anime">动画</a><a href="?mode=games" data-mode="games">二游</a></nav><h1>动画观看清单</h1><p>勾选看过的动画，生成清单图片。</p></header><div class="filter-top"><div class="years" id="years" aria-label="按年份筛选"></div><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索中文名 / 原名" aria-label="搜索动画名称"></label></div><div class="filter-bottom"><div class="quarters" id="quarters" aria-label="按季度筛选"><button data-quarter="all" class="active">全部季度</button><button data-quarter="1">冬季 <small>1月</small></button><button data-quarter="2">春季 <small>4月</small></button><button data-quarter="3">夏季 <small>7月</small></button><button data-quarter="4">秋季 <small>10月</small></button></div><label class="type-label"><select id="type" aria-label="动画类型"><option value="all">全部类型</option><option>TV</option><option>WEB</option><option>剧场版</option><option>OVA</option></select></label><label class="sort-label">排序 <select id="sort"><option value="popular">人气最高</option><option value="newest">首播最新</option><option value="oldest">首播最早</option><option value="score">评分最高</option><option value="title">名称顺序</option></select></label><label id="auto-series-option" class="series-toggle" title="按名称识别同系列季度，补选目录内作品（含筛选外）；取消时仅移除当前作品。"><input id="auto-series" type="checkbox"> 自动勾选同系列</label><label class="selected-toggle"><input id="selected-only" type="checkbox"> 只看已选</label></div></div>
      <aside class="collection"><div class="collection-top"><h2>我的观看清单</h2><button id="edit-collection" class="edit-button">编辑清单</button></div><div class="collection-count"><strong id="count">0</strong><span>部已选动画</span></div><div id="mini-covers" class="mini-covers"><div class="collection-empty">点击封面选择动画</div></div><div class="collection-actions"><label for="nickname">海报上的名字 <span>选填</span></label><input id="nickname" maxlength="20" placeholder="你的昵称"><button id="generate" class="primary" disabled>生成我的动画清单 <span>↗</span></button><p id="save-status" role="status">选择自动保存至此浏览器。</p></div></aside>
      </div>
    </div>
  </main>
  <dialog id="collection-dialog" aria-labelledby="editor-title" aria-describedby="editor-count">
    <div class="dialog-header"><h2 id="editor-title">编辑观看清单</h2><button id="close-editor" class="icon-button" aria-label="关闭清单编辑" autofocus>×</button></div>
    <p id="editor-count" class="dialog-copy" role="status"></p>
    <div class="editor-content"><div id="editor-grid" class="editor-grid"></div><div id="editor-empty" class="empty" hidden>清单里还没有动画，返回目录点击封面添加。</div></div>
    <div class="editor-footer"><div class="editor-tools"><button id="clear-selection" class="secondary danger">一键清空</button><button id="undo-clear" class="secondary" hidden>撤销清空</button></div><button id="done-editing" class="primary">完成</button></div>
  </dialog>
  <dialog id="poster-dialog"><div class="dialog-header"><div><h2>清单图片预览</h2></div><button id="close-dialog" class="icon-button" aria-label="关闭预览">×</button></div><p class="dialog-copy" id="poster-status" role="status">正在生成海报…</p><div id="poster-preview"></div><div class="dialog-footer"><button id="back" class="secondary">返回调整</button><div id="download-links"></div></div></dialog>
  <script type="module" src="app.js"></script>
</body></html>
